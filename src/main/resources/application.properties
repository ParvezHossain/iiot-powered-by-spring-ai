spring.application.name=iiot-powered-by-ai

# Embedded development database; data is discarded when the application stops.
spring.datasource.url=jdbc:h2:mem:iiot;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.default_schema=telemetry

# Flyway owns the application schema; public retains infrastructure extensions.
spring.flyway.default-schema=telemetry
spring.flyway.schemas=telemetry
spring.flyway.locations=classpath:db/migration

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Opt in with RAG_ENABLED=true when PostgreSQL/pgvector and the embedding model are available.
rag.enabled=false
rag.documents=classpath:equipment/*.md
rag.ingest-on-startup=true
rag.batch-size=16

# The agent requires both AGENT_ENABLED=true and RAG_ENABLED=true.
agent.enabled=false

# Opt in to the local Streamable HTTP MCP server at /mcp.
mcp.enabled=false
# MCP_API_KEY is required when enabled; no default credential is provided.

# Automatic visible log alerts; Gmail is opt-in and uses an account app password.
alerts.enabled=true
alerts.gmail.enabled=false
alerts.gmail.username=${GMAIL_USERNAME:}
alerts.gmail.app-password=${GMAIL_APP_PASSWORD:}
alerts.gmail.to=${ALERT_EMAIL_TO:}
