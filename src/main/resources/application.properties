spring.application.name=iiot-powered-by-ai

# ---------------------------------------------------------------------------
# Default local development database
# ---------------------------------------------------------------------------
# Docker overrides these properties using SPRING_DATASOURCE_* variables.
spring.datasource.url=jdbc:h2:mem:iiot;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.default_schema=telemetry

# ---------------------------------------------------------------------------
# Flyway
# ---------------------------------------------------------------------------
# Flyway owns the application schema.
spring.flyway.default-schema=telemetry
spring.flyway.schemas=telemetry
spring.flyway.locations=classpath:db/migration

# ---------------------------------------------------------------------------
# Actuator
# ---------------------------------------------------------------------------
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true

# ---------------------------------------------------------------------------
# RAG
# ---------------------------------------------------------------------------
rag.enabled=${RAG_ENABLED:false}
rag.documents=classpath:equipment/*.md
rag.ingest-on-startup=${RAG_INGEST_ON_STARTUP:true}
rag.batch-size=${RAG_BATCH_SIZE:16}
rag.answer-model=${RAG_ANSWER_MODEL:qwen2.5:1.5b}

# ---------------------------------------------------------------------------
# AI agent
# ---------------------------------------------------------------------------
# The agent requires both AGENT_ENABLED=true and RAG_ENABLED=true.
agent.enabled=${AGENT_ENABLED:false}
agent.model=${AGENT_MODEL:qwen2.5:1.5b}

# ---------------------------------------------------------------------------
# MCP
# ---------------------------------------------------------------------------
# Opt in to the local Streamable HTTP MCP server at /mcp.
mcp.enabled=${MCP_ENABLED:false}
mcp.api-key=${MCP_API_KEY:}

# ---------------------------------------------------------------------------
# Alerts
# ---------------------------------------------------------------------------
alerts.enabled=${ALERTS_ENABLED:true}
alerts.gmail.enabled=${ALERTS_GMAIL_ENABLED:false}
alerts.gmail.username=${GMAIL_USERNAME:}
alerts.gmail.app-password=${GMAIL_APP_PASSWORD:}
alerts.gmail.to=${ALERT_EMAIL_TO:}

# ---------------------------------------------------------------------------
# OpenAPI and Swagger UI
# ---------------------------------------------------------------------------
springdoc.show-actuator=true
springdoc.paths-to-match=/api/**,/actuator/health/**,/actuator/health
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.disable-swagger-default-url=true

# ---------------------------------------------------------------------------
# Authentication
# ---------------------------------------------------------------------------
# Base64 representation of at least 32 cryptographically random bytes.
auth.jwt-secret=${AUTH_JWT_SECRET:}

auth.issuer=${AUTH_ISSUER:iiot-api}
auth.audience=${AUTH_AUDIENCE:iiot-spa}

auth.access-ttl=${AUTH_ACCESS_TTL:PT15M}
auth.refresh-ttl=${AUTH_REFRESH_TTL:P7D}

auth.bcrypt-strength=${AUTH_BCRYPT_STRENGTH:12}
auth.max-login-attempts=${AUTH_MAX_LOGIN_ATTEMPTS:5}
auth.lockout=${AUTH_LOCKOUT:PT15M}
auth.requests-per-minute=${AUTH_REQUESTS_PER_MINUTE:30}

auth.cors-origins=${AUTH_CORS_ORIGINS:}

# These names now match the variables in .env and Docker Compose.
auth.initial-admin-username=${AUTH_INITIAL_ADMIN_USERNAME:}
auth.initial-admin-email=${AUTH_INITIAL_ADMIN_EMAIL:}
auth.initial-admin-password=${AUTH_INITIAL_ADMIN_PASSWORD:}

# ---------------------------------------------------------------------------
# Simulator
# ---------------------------------------------------------------------------
simulator.enabled=${SIMULATOR_ENABLED:true}
simulator.machine-count=${SIMULATOR_MACHINE_COUNT:5}
simulator.interval-ms=${SIMULATOR_INTERVAL_MS:5000}
simulator.anomaly-every-ticks=${SIMULATOR_ANOMALY_EVERY_TICKS:12}
simulator.seed=${SIMULATOR_SEED:42}

# logging.file.name=logs/application.log