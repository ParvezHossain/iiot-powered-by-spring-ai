spring.application.name=iiot-powered-by-ai

# Embedded development database; data is discarded when the application stops.
spring.datasource.url=jdbc:h2:mem:iiot;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.open-in-view=false

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
