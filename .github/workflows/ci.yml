name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: iiot_test
          POSTGRES_USER: iiot
          POSTGRES_PASSWORD: iiot_test
        ports:
          - 5432/tcp
        options: >-
          --health-cmd "pg_isready -U iiot -d iiot_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build and run tests
        run: ./mvnw --batch-mode --no-transfer-progress verify

      - name: Verify schema, simulator, and query API on PostgreSQL
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:${{ job.services.postgres.ports[5432] }}/iiot_test
          SPRING_DATASOURCE_USERNAME: iiot
          SPRING_DATASOURCE_PASSWORD: iiot_test
          SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
        run: ./mvnw --batch-mode --no-transfer-progress -Dtest=TelemetrySchemaTests,TelemetrySimulatorTests,TelemetryApiTests test

      - name: Verify vector ingestion transactions on pgvector
        env:
          RAG_PGVECTOR_TESTS: 'true'
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:${{ job.services.postgres.ports[5432] }}/iiot_test
          SPRING_DATASOURCE_USERNAME: iiot
          SPRING_DATASOURCE_PASSWORD: iiot_test
          SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
        run: ./mvnw --batch-mode --no-transfer-progress -Dtest=PgVectorIngestionTests test
